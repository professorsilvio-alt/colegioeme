{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema EME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
<div class="login-screen">
    <div class="login-box">
        <h2>Sistema de Ocorrências</h2>
        <p>Faça login para acessar</p>

        {% if messages %}
        {% for msg in messages %}
        <p class="login-erro">{{ msg }}</p>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <input type="text" name="usuario" placeholder="Usuário" autocomplete="username" required>
            <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</div>
</body>
</html>
